bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,c,spawn,noctalia msg settings-toggle
bind=SUPER,s,spawn,noctalia msg panel-toggle session
bind=SUPER,w,spawn,noctalia msg panel-toggle control-center network
bind=SUPER,e,toggle_named_scratchpad,scratchpad,none,ghostty --class=org.ghostty.scratchpad --background-opacity=1 -e elio
bind=SUPER+SHIFT,e,toggle_named_scratchpad,Emulator,Android Emulator - x:5554,none
bind=SUPER,Return,spawn,zellij terminal
bind=SUPER,d,spawn_shell,hex dictation toggle

bindl=none,XF86MonBrightnessUp,spawn,noctalia msg brightness-up 2%
bindl=none,XF86MonBrightnessDown,spawn,noctalia msg brightness-down 2%
bindl=SHIFT,XF86MonBrightnessUp,spawn,noctalia msg brightness-set 100%
bindl=SHIFT,XF86MonBrightnessDown,spawn,noctalia msg brightness-set 0%

bindl=none,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 2%
bindl=none,XF86AudioLowerVolume,spawn,noctalia msg volume-down 2%
bindl=none,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=SHIFT,XF86AudioMute,spawn,noctalia msg mic-mute

bind=none,Print,spawn,noctalia msg screenshot-region
bind=Alt,Print,spawn, noctalia msg screenshot-window
bind=SHIFT,Print,spawn_shell,noctalia msg plugin noctalia/screen_recorder:service all toggle

mousebind=SUPER+CTRL,btn_left,moveresize,curmove
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft
