[general]
autostart = ["noctalia"]
show_cheatsheet = false
xwayland = true

[input.keyboard]
options = "caps:swapescape"

[input.touchpad]
natural_scroll = true
accel_profile = "adaptive"

[input.cursor]
theme = "Bibata-Modern-Ice"

[layout.scrolling]
default_extent_fraction = 0.5

[keybinds]
"Mod+Tab" = "window-focus-next"
"Mod+h" = "window-focus-left"
"Mod+l" = "window-focus-right"
"Mod+j" = "window-focus-down"
"Mod+k" = "window-focus-up"
"Mod+Shift+h" = "column-move-left"
"Mod+Shift+l" = "column-move-right"
"Mod+Shift+j" = "window-move-down"
"Mod+Shift+k" = "window-move-up"
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

"Mod+Return" = { action = "spawn:ghostty +new-window", repeat = false }
"Mod+Period" = "workspace-next"
"Mod+Comma" = "workspace-previous"
"Mod+Shift+Period" = "window-move-to-workspace-next"
"Mod+Shift+Comma" = "window-move-to-workspace-previous"
"Mod+Ctrl+Comma" = "workspace-move-up"
"Mod+Ctrl+Period" = "workspace-move-down"

"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"Shift+XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle", allow_when_locked = true, repeat = false }

"XF86MonBrightnessUp" = { action = "spawn:brightnessctl set +2%", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl set 2%-", allow_when_locked = true }

"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Super+space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Super+v" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Super+c" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Super+s" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Super+w" = { action = "spawn:noctalia msg panel-toggle wallpaper", repeat = false }

"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Shift+Print" = { action = "spawn:noctalia msg plugin noctalia/screen_recorder:service all start", repeat = false }
"Shift+Alt+Print" = { action = "spawn:noctalia msg plugin noctalia/screen_recorder:service all stop", repeat = false }

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

[include.optional]
files = ["noctalia.toml"]
