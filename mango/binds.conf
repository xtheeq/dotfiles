# General
bind=SUPER,r,reload_config
bind=SUPER,q,killclient
bind=SUPER,backslash,togglefloating
bind=SUPER,Tab,toggleoverview
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,m,minimized
bind=SUPER+SHIFT,m,restore_minimized
bind=SUPER+SHIFT,s,toggle_scratchpad

# Focus / Movement
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right

# Groups
bind=SUPER+ALT,l,groupjoin,right
bind=SUPER+ALT,h,groupjoin,left
bind=SUPER+ALT,j,groupjoin,down
bind=SUPER+ALT,k,groupjoin,up
bind=SUPER+SHIFT,x,groupleave
bind=SUPER+SHIFT,l,groupfocus,next
bind=SUPER+SHIFT,h,groupfocus,prev

# Workspaces / Tags
bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0
bind=Ctrl,1,tag,1,0
bind=Ctrl,2,tag,2,0
bind=Ctrl,3,tag,3,0
bind=Ctrl,4,tag,4,0
bind=Ctrl,5,tag,5,0
bind=Ctrl,6,tag,6,0
bind=Ctrl,7,tag,7,0
bind=Ctrl,8,tag,8,0
bind=Ctrl,9,tag,9,0

# Scroller
scroller_proportion_preset=0.5,1.0
bind=SUPER,x,switch_proportion_preset
bind=SUPER,f,set_proportion,1.0
bind=SUPER+CTRL+ALT,h,scroller_stack,left
bind=SUPER+CTRL+ALT,l,scroller_stack,right
bind=SUPER+CTRL+ALT,k,scroller_stack,up
bind=SUPER+CTRL+ALT,j,scroller_stack,down

# Noctalia / Launchers
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,s,spawn,noctalia msg panel-toggle session
bind=SUPER,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,e,toggle_named_scratchpad,scratchpad,none,ghostty --class=org.ghostty.scratchpad --background-opacity=1 -e elio
bind=SUPER+SHIFT,e,toggle_named_scratchpad,Emulator,Android Emulator - x:5554,none
bind=SUPER,Return,spawn,ghostty +new-window

# wshowkeys
bind=SUPER,grave,spawn_shell,wshowkeys -a bottom -a right -s '#7aa2f7ff' -f '#ffffffff' -b '#1a1b26dd' -M
bind=SUPER+SHIFT,grave,spawn_shell,killall wshowkeys

# Media Keys
bind=none,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 0%
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 2%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 2%-
bind=none,XF86AudioMute,spawn,wpctl set-volume @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# msnap
bind=none,Print,spawn,msnap gui
bind=SHIFT,Print,spawn,msnap cast -t

# Mouse / Gestures
mousebind=SUPER+CTRL,btn_left,moveresize,curmove
mousebind=SUPER+SHIFT,btn_left,moveresize,curresize
gesturebind=none,right,3,focusdir,left
gesturebind=none,left,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoright
gesturebind=none,right,4,viewtoleft
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1
